[package]
name = "plotline"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["David Palmer"]
description = "Engine-independent sequences and capability requirements for authored game logic"
repository = "https://github.com/dp88/plotline"
license = "MIT OR Apache-2.0"
keywords = ["sequence", "dialogue", "quest", "prerequisites", "gamedev"]
categories = ["game-development", "data-structures"]
readme = "README.md"
exclude = [".github/", "art/", "RELEASING.md", "deny.toml"]

[package.metadata.docs.rs]
all-features = true

[features]
# Derives Serialize and Deserialize for the data types.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, default-features = false, features = [
  "alloc",
  "derive",
] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
single_match_else = "allow"
